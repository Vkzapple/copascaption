<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CopasCaption Generator Caption & Hashtag</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<span class="float">🌸</span>
<span class="float">⭐</span>
<span class="float">🍯</span>
<span class="float">💖</span>

<main>
  <header>
    <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="54" r="38" fill="#ffd93d" stroke="#e83e8c" stroke-width="4"/>
      <path d="M22 28 L30 10 L44 24 Z" fill="#ff6fae" stroke="#e83e8c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M78 28 L70 10 L56 24 Z" fill="#ff6fae" stroke="#e83e8c" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="37" cy="52" r="5" fill="#4a1d3a"/>
      <circle cx="63" cy="52" r="5" fill="#4a1d3a"/>
      <circle cx="28" cy="64" r="7" fill="#ff6fae" opacity="0.6"/>
      <circle cx="72" cy="64" r="7" fill="#ff6fae" opacity="0.6"/>
      <path d="M42 66 Q50 76 58 66" fill="none" stroke="#4a1d3a" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>Copy-Paste<span>Caption</span></h1>
    <p>Bikin caption & hashtag kece, 100% offline!</p>
  </header>

  <section class="panel">
    <div class="group">
      <span class="label">Mau mulai dari apa?</span>
      <div class="chips" id="modes">
        <button class="chip active" data-value="topik">Topik</button>
        <button class="chip" data-value="foto">Deskripsi Foto</button>
      </div>
    </div>

    <div class="group">
      <label class="label" for="input" id="inputLabel">Ceritain topiknya dong!</label>
      <textarea id="input" maxlength="500" placeholder="Contoh: Launching kopi susu gula aren di kafe baru kami"></textarea>
    </div>

    <div class="group">
      <span class="label">Posting di mana?</span>
      <div class="chips" id="platforms">
        <button class="chip active" data-value="Instagram">📷 Instagram</button>
        <button class="chip" data-value="LinkedIn">💼 LinkedIn</button>
        <button class="chip" data-value="X">🐦 X</button>
      </div>
    </div>

    <button class="go" id="generate"> Generate 3 Opsi!</button>
    <p class="note" id="note"></p>
  </section>

  <section id="results" aria-live="polite"></section>

  <footer>Made by evellkz</footer>
</main>

<script src="scripts.js"></script>
</body>
</html>
